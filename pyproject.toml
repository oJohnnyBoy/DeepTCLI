[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deeptcli"
version = "0.1.0"
description = "A lightweight CLI translator powered by the DeepL API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["deepl", "prompt_toolkit", "rich"]

[project.scripts]
deeptcli = "deeptcli.main:main"
DeepTCLI = "deeptcli.main:main"

[tool.setuptools]
packages = ["deeptcli"]
